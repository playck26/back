name: CI

# SPEC-001:TASK-010 — 1 workflow por repositório (poly-repo, ADR-001).
# Só valida este repositório, não depende de nenhum outro dos 4.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres efêmero do runner, para a suíte de concorrência. Some com o
    # job; não tem relação com o Neon de produção.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: playck_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint:ci

      - run: pnpm run typecheck

      - run: pnpm test

      # TEST-001/TEST-002 (Fase 5, Hardening): suítes Supertest com Prisma
      # mockado — não toca o Neon, então não precisa de DATABASE_URL.
      # JWT_*_SECRET só precisam existir (não são segredos reais; nenhum
      # token gerado aqui sai deste job).
      - run: pnpm test:e2e
        env:
          JWT_ACCESS_SECRET: ci-e2e-access-secret
          JWT_REFRESH_SECRET: ci-e2e-refresh-secret

      # SPEC-015 — as suítes que precisam de Postgres DE VERDADE:
      # a rede de regressão da raiz de lock (AC-000i/INV-029, duas
      # conexões) e a tabela de provas FIT-005 (chamada de ponta a ponta).
      # Mock não tem lock, nem snapshot, nem constraint — não reprovaria
      # nenhum dos defeitos que estas suítes existem para pegar.
      #
      # Banco efêmero do serviço abaixo, nunca o Neon: a suíte escreve.
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/playck_ci?schema=public

      - run: pnpm run test:banco
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/playck_ci?schema=public

      - run: pnpm build

      # Lacuna registrada em STATUS.md: `openapi.json` (contrato consumido
      # pelos 3 frontends, ADR-001) é regenerado manualmente
      # (`pnpm run openapi:export`) e podia ficar stale sem ninguém notar.
      # Regenera e falha se o resultado diferir do que está commitado —
      # não precisa de banco nem de porta HTTP (PrismaService é lazy),
      # só do secret dummy que a strategy do JWT exige pra instanciar.
      - run: pnpm run openapi:export
        env:
          JWT_ACCESS_SECRET: ci-openapi-export-secret

      - run: git diff --exit-code openapi.json
