name: CI

# SPEC-001:TASK-010 — 1 workflow por repositório (poly-repo, ADR-001).
# Só valida este repositório, não depende de nenhum outro dos 4.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres efêmero do runner, para a suíte de concorrência. Some com o
    # job; não tem relação com o Neon de produção.
    services:
      postgres:
        # SPEC-043/TASK-002: mesma versao maior da Neon (18.6). Com 16 aqui, a
        # prova rodava contra uma coisa e a producao era outra -- a familia de
        # defeito que ja apareceu 4x (STATUS 2026-09-01).
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: playck_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint:ci

      - run: pnpm run typecheck

      - run: pnpm test

      # TEST-001/TEST-002 (Fase 5, Hardening): suítes Supertest com Prisma
      # mockado — não toca o Neon, então não precisa de DATABASE_URL.
      # JWT_*_SECRET só precisam existir (não são segredos reais; nenhum
      # token gerado aqui sai deste job).
      # SPEC-017/TASK-001: o AppModule agora registra o StorageModule, que
      # valida as seis variaveis do Spaces no boot. Aqui elas so precisam
      # EXISTIR e ter forma valida — nenhum teste do CI fala com o bucket
      # (quem fala e o FIT-006, contra o bucket real, fora do CI).
      - run: pnpm test:e2e
        env:
          JWT_ACCESS_SECRET: ci-e2e-access-secret
          JWT_REFRESH_SECRET: ci-e2e-refresh-secret
          SPACES_REGION: nyc3
          SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com
          SPACES_BUCKET: playck-ci
          SPACES_CDN_URL: https://playck-ci.nyc3.cdn.digitaloceanspaces.com
          SPACES_KEY: ci-spaces-key
          SPACES_SECRET: ci-spaces-secret

      # SPEC-015 — as suítes que precisam de Postgres DE VERDADE:
      # a rede de regressão da raiz de lock (AC-000i/INV-029, duas
      # conexões) e a tabela de provas FIT-005 (chamada de ponta a ponta).
      # Mock não tem lock, nem snapshot, nem constraint — não reprovaria
      # nenhum dos defeitos que estas suítes existem para pegar.
      #
      # Banco efêmero do serviço abaixo, nunca o Neon: a suíte escreve.
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/playck_ci?schema=public

      - run: pnpm run test:banco
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/playck_ci?schema=public

      - run: pnpm build

      # Lacuna registrada em STATUS.md: `openapi.json` (contrato consumido
      # pelos 3 frontends, ADR-001) é regenerado manualmente
      # (`pnpm run openapi:export`) e podia ficar stale sem ninguém notar.
      # Regenera e falha se o resultado diferir do que está commitado —
      # não precisa de banco nem de porta HTTP (PrismaService é lazy),
      # só do secret dummy que a strategy do JWT exige pra instanciar.
      - run: pnpm run openapi:export
        env:
          JWT_ACCESS_SECRET: ci-openapi-export-secret
          SPACES_REGION: nyc3
          SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com
          SPACES_BUCKET: playck-ci
          SPACES_CDN_URL: https://playck-ci.nyc3.cdn.digitaloceanspaces.com
          SPACES_KEY: ci-spaces-key
          SPACES_SECRET: ci-spaces-secret

      - run: git diff --exit-code openapi.json

  # SPEC-017/TASK-007 — FIT-006 contra o bucket REAL.
  #
  # A 3ª validação cruzada apontou, com razão: "rodado à mão antes de
  # publicar mudança em `storage/`" é hábito humano, não gate. Em três meses
  # o FIT-006 vira decoração.
  #
  # Este job é o gate. Duas escolhas de segurança nele:
  #
  # 1. **`concurrency` serializa.** A suíte escreve e apaga objetos com chave
  #    derivada do conteúdo — dois jobs simultâneos gerariam a MESMA chave e
  #    um apagaria o objeto que o outro ainda está lendo. Falha por corrida
  #    num teste de bucket é a pior espécie: parece defeito do produto.
  # 2. **Sem os secrets, avisa em vez de fingir que passou.** Um job que
  #    "passa" pulando em silêncio é pior que job nenhum — vira sinal verde
  #    sobre nada. O `::warning::` aparece no resumo do run.
  #
  # A suíte só escreve sob o próprio prefixo, e a trava recusa qualquer
  # bucket que não seja o `playck-media` — e essa trava tem prova própria em
  # `test/bucket/trava-do-bucket.e2e-spec.ts`, que roda no job acima.
  fit-006:
    runs-on: ubuntu-latest
    concurrency:
      group: fit-006-bucket-real
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: FIT-006 contra o bucket real
        env:
          SPACES_REGION: ${{ secrets.SPACES_REGION }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_CDN_URL: ${{ secrets.SPACES_CDN_URL }}
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
        run: |
          if [ -z "$SPACES_KEY" ]; then
            # SPEC-043/REQ-007: sem os secrets, o job só pode ficar verde em
            # PR de FORK (que nunca os recebe). Em push para `main` ou em PR do
            # próprio repositório, secret ausente é configuração quebrada — e
            # um gate que fica verde sem rodar foi a causa raiz da SPEC-043.
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "::error title=FIT-006 não rodou::Os secrets SPACES_* não estão configurados neste repositório. Sem eles as 13 provas contra o bucket real não têm gate — configure os secrets; este job não fica verde sem rodar."
              exit 1
            fi
            echo "::warning title=FIT-006 não rodou::PR de fork não recebe os secrets SPACES_*; as provas contra o bucket real rodam no merge."
            exit 0
          fi
          pnpm run test:bucket

  # SPEC-043 — o gate de concorrência como CHECK DE PR, em toda PR, sem
  # detector de paths. Antes ele morava num passo condicional de um workflow
  # manual e ficou 26 dias sem rodar com cinco badges verdes
  # (AUDITORIA-2026-09-03-FIT-001.md). Job próprio para que `skipped` não
  # exista: ou roda e conclui, ou o check falta — e o ruleset de `main`
  # exige `fit-critical` no `head_sha` exato da PR.
  #
  # Postgres do runner na mesma versão maior da Neon: preserva `EXCLUDE`,
  # locks, transações e triggers `DEFERRABLE`. O que ele NÃO reproduz —
  # pooler em modo transação, latência, limites de conexão — fica com o
  # canário `FIT-001 Neon` do `db-migrate.yml`, que é adicional, não
  # substituto.
  fit-critical:
    name: fit-critical
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: playck_fit
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5433/playck_fit?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      # FIT-001 (a–d) e FIT-002 vivem em `test/fit/*.fit-spec.ts`; o nome
      # do passo é o que o `evd.yaml` cita (`step: FIT-001/FIT-002`).
      - name: FIT-001/FIT-002
        run: pnpm run test:fit
        env:
          JWT_ACCESS_SECRET: fit-access-secret
          JWT_REFRESH_SECRET: fit-refresh-secret
          SPACES_REGION: nyc3
          SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com
          SPACES_BUCKET: playck-ci
          SPACES_CDN_URL: https://playck-ci.nyc3.cdn.digitaloceanspaces.com
          SPACES_KEY: ci-spaces-key
          SPACES_SECRET: ci-spaces-secret
