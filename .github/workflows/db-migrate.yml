name: DB Migrate & Seed (manual)

# Disparo manual (workflow_dispatch) — roda a migration real do Prisma e o
# seed de desenvolvimento contra o Neon. Existe porque a rede local (tanto
# o ambiente do agente quanto a rede doméstica do usuário) não consegue
# alcançar a porta 5432 do Neon; os runners do GitHub Actions não têm essa
# restrição. DATABASE_URL vem de um secret do repositório, nunca aparece
# em log.
on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Rodar também o seed de desenvolvimento (empresa demo + admin + super_admin) e o smoke test (auth + MOD-002)?"
        type: boolean
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Remover tabela de exemplo da Neon (playing_with_neon)
        run: echo 'DROP TABLE IF EXISTS "playing_with_neon";' | pnpm exec prisma db execute --stdin --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prisma migrate deploy
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed de desenvolvimento
        if: ${{ inputs.run_seed }}
        run: pnpm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Smoke test — auth + MOD-002 (companies) de ponta a ponta contra o Neon real
        if: ${{ inputs.run_seed }}
        timeout-minutes: 10
        run: |
          set -e
          pnpm run build
          JWT_ACCESS_SECRET=ci-smoke-access JWT_REFRESH_SECRET=ci-smoke-refresh PORT=3000 node dist/main.js &
          APP_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/v1/auth/me -o /dev/null -w '' 2>/dev/null && break
            sleep 1
          done

          echo "--- login (senha correta) ---"
          LOGIN_RES=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@smarttennis.demo","senha":"trocar-em-producao-123"}')
          echo "$LOGIN_RES"
          echo "$LOGIN_RES" | jq -e '.accessToken and .refreshToken and .usuario.role == "company_admin"'

          ACCESS_TOKEN=$(echo "$LOGIN_RES" | jq -r '.accessToken')

          echo "--- login (senha errada, precisa ser 401 genérico) ---"
          WRONG_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@smarttennis.demo","senha":"senha-errada-123"}')
          [ "$WRONG_RES" = "401" ] || (echo "esperado 401, veio $WRONG_RES" && exit 1)

          echo "--- /auth/me com o token ---"
          ME_RES=$(curl -s http://localhost:3000/api/v1/auth/me -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$ME_RES"
          echo "$ME_RES" | jq -e '.email == "admin@smarttennis.demo"'

          echo "--- company_admin tentando /companies precisa ser 403 (SPEC-002 AC-004) ---"
          FORBIDDEN_RES=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/companies \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          [ "$FORBIDDEN_RES" = "403" ] || (echo "esperado 403, veio $FORBIDDEN_RES" && exit 1)

          echo "--- login super_admin ---"
          SA_LOGIN_RES=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"superadmin@playck.demo","senha":"trocar-em-producao-123"}')
          echo "$SA_LOGIN_RES"
          echo "$SA_LOGIN_RES" | jq -e '.usuario.role == "super_admin"'
          SA_TOKEN=$(echo "$SA_LOGIN_RES" | jq -r '.accessToken')

          echo "--- GET /companies (super_admin) ---"
          curl -s http://localhost:3000/api/v1/companies -H "Authorization: Bearer $SA_TOKEN" \
            | jq -e '.data and (.total >= 1)'

          echo "--- POST /companies (cria empresa + admin numa transação) ---"
          RUN_ID=$(date +%s)
          CREATE_RES=$(curl -s -X POST http://localhost:3000/api/v1/companies \
            -H "Authorization: Bearer $SA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Empresa CI $RUN_ID\",\"esportes\":[\"padel\"],\"adminInicial\":{\"nome\":\"Admin CI\",\"email\":\"ci-$RUN_ID@playck-tests.demo\",\"senha\":\"senha-forte-123\"}}")
          echo "$CREATE_RES"
          echo "$CREATE_RES" | jq -e '.empresa.id and .adminUsuario.role == "company_admin" and (.adminUsuario | has("senhaHash") | not)'
          COMPANY_ID=$(echo "$CREATE_RES" | jq -r '.empresa.id')

          echo "--- login do admin recém-criado (empresa ativa) ---"
          NEW_ADMIN_LOGIN=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"ci-$RUN_ID@playck-tests.demo\",\"senha\":\"senha-forte-123\"}")
          [ "$NEW_ADMIN_LOGIN" = "200" ] || (echo "esperado 200, veio $NEW_ADMIN_LOGIN" && exit 1)
          # (login retorna 200 desde a correção de HttpCode em auth.controller.ts)

          echo "--- PATCH /companies/:id (renomear) ---"
          curl -s -X PATCH "http://localhost:3000/api/v1/companies/$COMPANY_ID" \
            -H "Authorization: Bearer $SA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Empresa CI $RUN_ID (renomeada)\"}" \
            | jq -e ".nome == \"Empresa CI $RUN_ID (renomeada)\""

          echo "--- PATCH /companies/:id/status (inativar) ---"
          curl -s -X PATCH "http://localhost:3000/api/v1/companies/$COMPANY_ID/status" \
            -H "Authorization: Bearer $SA_TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"inativa"}' | jq -e '.status == "inativa"'

          echo "--- login do admin da empresa agora inativa precisa falhar (SPEC-002 AC-003) ---"
          BLOCKED_LOGIN=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"ci-$RUN_ID@playck-tests.demo\",\"senha\":\"senha-forte-123\"}")
          [ "$BLOCKED_LOGIN" = "401" ] || (echo "esperado 401, veio $BLOCKED_LOGIN" && exit 1)

          echo "--- GET /courts (quadras semeadas pelo seed etapa 2) ---"
          COURTS_RES=$(curl -s http://localhost:3000/api/v1/courts -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$COURTS_RES" | jq -e '.total >= 1'
          QUADRA_ID=$(echo "$COURTS_RES" | jq -r '.data[0].id')

          echo "--- limpando reservas de teste residuais de execuções anteriores (idempotência do smoke test) ---"
          cat <<SQL | pnpm exec prisma db execute --stdin --schema prisma/schema.prisma
          DELETE FROM ocupacoes_quadra WHERE quadra_id = '$QUADRA_ID' AND data >= '2026-08-25' AND data <= '2026-09-30';
          SQL

          echo "--- GET /courts/:id/availability ---"
          curl -s "http://localhost:3000/api/v1/courts/$QUADRA_ID/availability?data=2026-08-25" \
            -H "Authorization: Bearer $ACCESS_TOKEN" | jq -e '.slots | length == 16'

          echo "--- cria aluno de teste pra usar nas reservas ---"
          STUDENT_RES=$(curl -s -X POST http://localhost:3000/api/v1/students \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Aluno CI\",\"email\":\"aluno-ci-$RUN_ID@playck-tests.demo\"}")
          echo "$STUDENT_RES"
          STUDENT_ID=$(echo "$STUDENT_RES" | jq -r '.id')

          echo "--- POST /bookings (reserva avulsa sem conflito) ---"
          BOOKING_RES=$(curl -s -X POST http://localhost:3000/api/v1/bookings \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"quadraId\":\"$QUADRA_ID\",\"data\":\"2026-08-25\",\"horaInicio\":\"09:00\",\"horaFim\":\"10:00\",\"alunoId\":\"$STUDENT_ID\"}")
          echo "$BOOKING_RES"
          echo "$BOOKING_RES" | jq -e '.statusPagamento == "pendente_pagamento" and .origemTipo == "AVULSO"'
          BOOKING_ID=$(echo "$BOOKING_RES" | jq -r '.id')

          echo "--- POST /bookings no mesmo horário precisa ser 409 (REQ-004) ---"
          CONFLICT_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/bookings \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"quadraId\":\"$QUADRA_ID\",\"data\":\"2026-08-25\",\"horaInicio\":\"09:00\",\"horaFim\":\"10:00\",\"alunoId\":\"$STUDENT_ID\"}")
          [ "$CONFLICT_RES" = "409" ] || (echo "esperado 409, veio $CONFLICT_RES" && exit 1)

          echo "--- cancelar libera o slot (AC-003) ---"
          curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/bookings/$BOOKING_ID/cancel" \
            -H "Authorization: Bearer $ACCESS_TOKEN" | grep -q 204
          REBOOK_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/bookings \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"quadraId\":\"$QUADRA_ID\",\"data\":\"2026-08-25\",\"horaInicio\":\"09:00\",\"horaFim\":\"10:00\",\"alunoId\":\"$STUDENT_ID\"}")
          [ "$REBOOK_RES" = "201" ] || (echo "esperado 201 após cancelar, veio $REBOOK_RES" && exit 1)

          echo "--- FIT-001: 2 requisições simultâneas no mesmo slot, 20 execuções, zero overbooking (NFR-001) ---"
          FALHAS=0
          for i in $(seq 1 20); do
            DIA=$(printf "2026-09-%02d" "$i")
            BODY="{\"quadraId\":\"$QUADRA_ID\",\"data\":\"$DIA\",\"horaInicio\":\"10:00\",\"horaFim\":\"11:00\",\"alunoId\":\"$STUDENT_ID\"}"
            curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/bookings \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY" > "/tmp/fit1_${i}.code" &
            PID1=$!
            curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/bookings \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY" > "/tmp/fit2_${i}.code" &
            PID2=$!
            wait "$PID1" "$PID2"
            C1=$(cat "/tmp/fit1_${i}.code")
            C2=$(cat "/tmp/fit2_${i}.code")
            if { [ "$C1" = "201" ] && [ "$C2" = "409" ]; } || { [ "$C1" = "409" ] && [ "$C2" = "201" ]; }; then
              echo "  iteração $i OK ($C1/$C2)"
            else
              echo "  iteração $i FALHOU ($C1/$C2) — overbooking ou erro inesperado"
              FALHAS=$((FALHAS + 1))
            fi
          done
          if [ "$FALHAS" -gt 0 ]; then
            echo "FIT-001 falhou em $FALHAS de 20 execuções"
            exit 1
          fi
          echo "FIT-001 OK — 20/20 execuções sem overbooking sob concorrência (INV-001 comprovado no banco real)"

          kill $APP_PID

          echo "--- limpando dado de teste criado pelo smoke test ---"
          cat <<SQL | pnpm exec prisma db execute --stdin --schema prisma/schema.prisma
          DELETE FROM usuarios WHERE email = 'ci-$RUN_ID@playck-tests.demo';
          DELETE FROM empresas WHERE id = '$COMPANY_ID';
          DELETE FROM ocupacoes_quadra WHERE quadra_id = '$QUADRA_ID' AND data >= '2026-08-25' AND data <= '2026-09-30';
          DELETE FROM alunos WHERE usuario_id = (SELECT id FROM usuarios WHERE email = 'aluno-ci-$RUN_ID@playck-tests.demo');
          DELETE FROM usuarios WHERE email = 'aluno-ci-$RUN_ID@playck-tests.demo';
          SQL

          echo "Smoke test OK — auth + MOD-002 + MOD-005 (com FIT-001) funcionam de ponta a ponta contra o Neon."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
