name: DB Migrate & Seed (manual)

# Disparo manual (workflow_dispatch) — roda a migration real do Prisma e o
# seed de desenvolvimento contra o Neon. Existe porque a rede local (tanto
# o ambiente do agente quanto a rede doméstica do usuário) não consegue
# alcançar a porta 5432 do Neon; os runners do GitHub Actions não têm essa
# restrição. DATABASE_URL vem de um secret do repositório, nunca aparece
# em log.
on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Rodar também o seed de desenvolvimento (empresa demo + admin + super_admin) e o smoke test (auth + MOD-002)?"
        type: boolean
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Remover tabela de exemplo da Neon (playing_with_neon)
        run: echo 'DROP TABLE IF EXISTS "playing_with_neon";' | pnpm exec prisma db execute --stdin --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prisma migrate deploy
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed de desenvolvimento
        if: ${{ inputs.run_seed }}
        run: pnpm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # SPEC-014:TASK-000 — o seed nao tem mais senha embutida. Estes
          # secrets precisam existir no repositorio; sem eles o seed falha
          # alto, de proposito.
          SEED_ADMIN_SENHA: ${{ secrets.SEED_ADMIN_SENHA }}
          SEED_SUPER_ADMIN_SENHA: ${{ secrets.SEED_SUPER_ADMIN_SENHA }}

      # 2026-08-23: o smoke test autenticava como `admin@smarttennis.demo`,
      # que e a conta **de producao** do cliente-vitrine — funcionava so
      # porque ela compartilhava a senha do seed. Ao tirar a senha do codigo
      # (SPEC-014:TASK-000) o acoplamento ficou visivel: teste de CI nao
      # pode depender de credencial de conta real. Passou a usar
      # `admin@playck-qa.demo`, que e a conta que o **proprio seed cria**.
      - name: Smoke test — auth + MOD-002 (companies) de ponta a ponta contra o Neon real
        if: ${{ inputs.run_seed }}
        timeout-minutes: 10
        run: |
          set -e
          pnpm run build
          JWT_ACCESS_SECRET=ci-smoke-access JWT_REFRESH_SECRET=ci-smoke-refresh PORT=3000 node dist/main.js &
          APP_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/v1/auth/me -o /dev/null -w '' 2>/dev/null && break
            sleep 1
          done

          echo "--- login (senha correta) ---"
          LOGIN_RES=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@playck-qa.demo\",\"senha\":\"$SEED_ADMIN_SENHA\"}")
          echo "$LOGIN_RES"
          echo "$LOGIN_RES" | jq -e '.accessToken and .refreshToken and .usuario.role == "company_admin"'

          ACCESS_TOKEN=$(echo "$LOGIN_RES" | jq -r '.accessToken')

          echo "--- login (senha errada, precisa ser 401 genérico) ---"
          WRONG_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@playck-qa.demo","senha":"senha-errada-123"}')
          [ "$WRONG_RES" = "401" ] || (echo "esperado 401, veio $WRONG_RES" && exit 1)

          echo "--- /auth/me com o token ---"
          ME_RES=$(curl -s http://localhost:3000/api/v1/auth/me -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$ME_RES"
          echo "$ME_RES" | jq -e '.email == "admin@playck-qa.demo"'

          echo "--- company_admin tentando /companies precisa ser 403 (SPEC-002 AC-004) ---"
          FORBIDDEN_RES=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/companies \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          [ "$FORBIDDEN_RES" = "403" ] || (echo "esperado 403, veio $FORBIDDEN_RES" && exit 1)

          echo "--- login super_admin ---"
          SA_LOGIN_RES=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"superadmin@playck.demo\",\"senha\":\"$SEED_SUPER_ADMIN_SENHA\"}")
          echo "$SA_LOGIN_RES"
          echo "$SA_LOGIN_RES" | jq -e '.usuario.role == "super_admin"'
          SA_TOKEN=$(echo "$SA_LOGIN_RES" | jq -r '.accessToken')

          echo "--- GET /companies (super_admin) ---"
          curl -s http://localhost:3000/api/v1/companies -H "Authorization: Bearer $SA_TOKEN" \
            | jq -e '.data and (.total >= 1)'

          echo "--- POST /companies (cria empresa + admin numa transação) ---"
          RUN_ID=$(date +%s)
          CREATE_RES=$(curl -s -X POST http://localhost:3000/api/v1/companies \
            -H "Authorization: Bearer $SA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Empresa CI $RUN_ID\",\"esportes\":[\"padel\"],\"adminInicial\":{\"nome\":\"Admin CI\",\"email\":\"ci-$RUN_ID@playck-tests.demo\",\"senha\":\"senha-forte-123\"}}")
          echo "$CREATE_RES"
          echo "$CREATE_RES" | jq -e '.empresa.id and .adminUsuario.role == "company_admin" and (.adminUsuario | has("senhaHash") | not)'
          COMPANY_ID=$(echo "$CREATE_RES" | jq -r '.empresa.id')

          echo "--- login do admin recém-criado (empresa ativa) ---"
          NEW_ADMIN_LOGIN=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"ci-$RUN_ID@playck-tests.demo\",\"senha\":\"senha-forte-123\"}")
          [ "$NEW_ADMIN_LOGIN" = "200" ] || (echo "esperado 200, veio $NEW_ADMIN_LOGIN" && exit 1)
          # (login retorna 200 desde a correção de HttpCode em auth.controller.ts)

          echo "--- PATCH /companies/:id (renomear) ---"
          curl -s -X PATCH "http://localhost:3000/api/v1/companies/$COMPANY_ID" \
            -H "Authorization: Bearer $SA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Empresa CI $RUN_ID (renomeada)\"}" \
            | jq -e ".nome == \"Empresa CI $RUN_ID (renomeada)\""

          echo "--- PATCH /companies/:id/status (inativar) ---"
          curl -s -X PATCH "http://localhost:3000/api/v1/companies/$COMPANY_ID/status" \
            -H "Authorization: Bearer $SA_TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"inativa"}' | jq -e '.status == "inativa"'

          echo "--- login do admin da empresa agora inativa precisa falhar (SPEC-002 AC-003) ---"
          BLOCKED_LOGIN=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"ci-$RUN_ID@playck-tests.demo\",\"senha\":\"senha-forte-123\"}")
          [ "$BLOCKED_LOGIN" = "401" ] || (echo "esperado 401, veio $BLOCKED_LOGIN" && exit 1)

          echo "--- GET /courts (quadras semeadas pelo seed etapa 2) ---"
          COURTS_RES=$(curl -s http://localhost:3000/api/v1/courts -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$COURTS_RES" | jq -e '.total >= 1'
          QUADRA_ID=$(echo "$COURTS_RES" | jq -r '.data[0].id')

          echo "--- limpando reservas/turmas de teste residuais de execuções anteriores (idempotência do smoke test) ---"
          # SPEC-032: `eventos_de_ocupacao` referencia a ocupacao e a acao com
          # ON DELETE RESTRICT, e as duas tabelas de auditoria sao append-only
          # por trigger. A valvula da trigger exige a role `playck_test_cleanup`,
          # que so existe no banco de testes do CI — nao no Neon. Aqui o caminho
          # e o do DONO das tabelas (o mesmo usuario que roda as migrations):
          # desligar as duas triggers, apagar na ordem evento -> acao ->
          # ocupacao, religar. Tudo numa transacao: se um DELETE falhar, o
          # rollback religa as triggers junto. So faz sentido contra DEV.
          cat <<SQL | pnpm exec prisma db execute --stdin --schema prisma/schema.prisma
          BEGIN;
          ALTER TABLE eventos_de_ocupacao DISABLE TRIGGER eventos_append_only;
          ALTER TABLE acoes_administrativas DISABLE TRIGGER acoes_append_only;
          DELETE FROM eventos_de_ocupacao WHERE ocupacao_id IN (
            SELECT id FROM ocupacoes_quadra
             WHERE (quadra_id = '$QUADRA_ID' AND data >= '2026-08-25' AND data <= '2026-09-30')
                OR origem_turma_id IN (SELECT id FROM turmas WHERE nome LIKE 'Turma CI %'));
          DELETE FROM acoes_administrativas a WHERE NOT EXISTS (SELECT 1 FROM eventos_de_ocupacao e WHERE e.acao_id = a.id);
          DELETE FROM ocupacoes_quadra WHERE quadra_id = '$QUADRA_ID' AND data >= '2026-08-25' AND data <= '2026-09-30';
          DELETE FROM turma_alunos WHERE turma_id IN (SELECT id FROM turmas WHERE nome LIKE 'Turma CI %');
          DELETE FROM ocupacoes_quadra WHERE origem_turma_id IN (SELECT id FROM turmas WHERE nome LIKE 'Turma CI %');
          DELETE FROM turmas WHERE nome LIKE 'Turma CI %';
          ALTER TABLE eventos_de_ocupacao ENABLE TRIGGER eventos_append_only;
          ALTER TABLE acoes_administrativas ENABLE TRIGGER acoes_append_only;
          COMMIT;
          SQL

          echo "--- GET /courts/:id/availability ---"
          curl -s "http://localhost:3000/api/v1/courts/$QUADRA_ID/availability?data=2026-08-25" \
            -H "Authorization: Bearer $ACCESS_TOKEN" | jq -e '.slots | length == 16'

          echo "--- cria aluno de teste pra usar nas reservas ---"
          STUDENT_RES=$(curl -s -X POST http://localhost:3000/api/v1/students \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Aluno CI\",\"email\":\"aluno-ci-$RUN_ID@playck-tests.demo\"}")
          echo "$STUDENT_RES"
          STUDENT_ID=$(echo "$STUDENT_RES" | jq -r '.id')

          echo "--- POST /bookings (reserva avulsa sem conflito) ---"
          BOOKING_RES=$(curl -s -X POST http://localhost:3000/api/v1/bookings \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"quadraId\":\"$QUADRA_ID\",\"data\":\"2026-08-25\",\"horaInicio\":\"09:00\",\"horaFim\":\"10:00\",\"alunoId\":\"$STUDENT_ID\"}")
          echo "$BOOKING_RES"
          echo "$BOOKING_RES" | jq -e '.statusPagamento == "pendente_pagamento" and .origemTipo == "AVULSO"'
          BOOKING_ID=$(echo "$BOOKING_RES" | jq -r '.id')

          echo "--- POST /bookings no mesmo horário precisa ser 409 (REQ-004) ---"
          CONFLICT_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/bookings \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"quadraId\":\"$QUADRA_ID\",\"data\":\"2026-08-25\",\"horaInicio\":\"09:00\",\"horaFim\":\"10:00\",\"alunoId\":\"$STUDENT_ID\"}")
          [ "$CONFLICT_RES" = "409" ] || (echo "esperado 409, veio $CONFLICT_RES" && exit 1)

          echo "--- cancelar libera o slot (AC-003) ---"
          curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/bookings/$BOOKING_ID/cancel" \
            -H "Authorization: Bearer $ACCESS_TOKEN" | grep -q 204
          REBOOK_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/bookings \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"quadraId\":\"$QUADRA_ID\",\"data\":\"2026-08-25\",\"horaInicio\":\"09:00\",\"horaFim\":\"10:00\",\"alunoId\":\"$STUDENT_ID\"}")
          [ "$REBOOK_RES" = "201" ] || (echo "esperado 201 após cancelar, veio $REBOOK_RES" && exit 1)

          echo "--- FIT-001: 2 requisições simultâneas no mesmo slot, 20 execuções, zero overbooking (NFR-001) ---"
          FALHAS=0
          for i in $(seq 1 20); do
            DIA=$(printf "2026-09-%02d" "$i")
            BODY="{\"quadraId\":\"$QUADRA_ID\",\"data\":\"$DIA\",\"horaInicio\":\"10:00\",\"horaFim\":\"11:00\",\"alunoId\":\"$STUDENT_ID\"}"
            curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/bookings \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY" > "/tmp/fit1_${i}.code" &
            PID1=$!
            curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/bookings \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY" > "/tmp/fit2_${i}.code" &
            PID2=$!
            wait "$PID1" "$PID2"
            C1=$(cat "/tmp/fit1_${i}.code")
            C2=$(cat "/tmp/fit2_${i}.code")
            if { [ "$C1" = "201" ] && [ "$C2" = "409" ]; } || { [ "$C1" = "409" ] && [ "$C2" = "201" ]; }; then
              echo "  iteração $i OK ($C1/$C2)"
            else
              echo "  iteração $i FALHOU ($C1/$C2) — overbooking ou erro inesperado"
              FALHAS=$((FALHAS + 1))
            fi
          done
          if [ "$FALHAS" -gt 0 ]; then
            echo "FIT-001 falhou em $FALHAS de 20 execuções"
            exit 1
          fi
          echo "FIT-001 OK — 20/20 execuções sem overbooking sob concorrência (INV-001 comprovado no banco real)"

          echo "--- MOD-004: cria turma vinculada à quadra semeada (REQ-002/003) ---"
          DIA_SEMANA_TESTE=3
          CLASS_RES=$(curl -s -X POST http://localhost:3000/api/v1/classes \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Turma CI $RUN_ID\",\"quadraId\":\"$QUADRA_ID\",\"encontros\":[{\"diaSemana\":$DIA_SEMANA_TESTE,\"horaInicio\":\"11:00\",\"horaFim\":\"12:00\"}],\"capacidade\":1}")
          echo "$CLASS_RES"
          echo "$CLASS_RES" | jq -e '.id and .alunosAlocados == 0'
          CLASS_ID=$(echo "$CLASS_RES" | jq -r '.id')

          echo "--- criar 2ª turma na mesma quadra/dia/hora precisa ser 409, turma não criada (AC-001, NFR-001) ---"
          CLASS_CONFLICT_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/classes \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Turma CI Conflito $RUN_ID\",\"quadraId\":\"$QUADRA_ID\",\"encontros\":[{\"diaSemana\":$DIA_SEMANA_TESTE,\"horaInicio\":\"11:00\",\"horaFim\":\"12:00\"}],\"capacidade\":1}")
          [ "$CLASS_CONFLICT_RES" = "409" ] || (echo "esperado 409, veio $CLASS_CONFLICT_RES" && exit 1)

          echo "--- GET /classes/:id (detalhe com alocação) ---"
          curl -s "http://localhost:3000/api/v1/classes/$CLASS_ID" -H "Authorization: Bearer $ACCESS_TOKEN" \
            | jq -e '.capacidade == 1 and (.alunos | length) == 0'

          echo "--- aloca aluno na turma de capacidade 1 (REQ-004) ---"
          ALLOC_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/classes/$CLASS_ID/students/$STUDENT_ID" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          [ "$ALLOC_RES" = "201" ] || (echo "esperado 201, veio $ALLOC_RES" && exit 1)

          echo "--- alocar o N+1-ésimo aluno (N=1) precisa ser 409 (AC-002, INV-003) ---"
          STUDENT2_RES=$(curl -s -X POST http://localhost:3000/api/v1/students \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"nome\":\"Aluno CI 2\",\"email\":\"aluno-ci-2-$RUN_ID@playck-tests.demo\"}")
          STUDENT2_ID=$(echo "$STUDENT2_RES" | jq -r '.id')
          ALLOC2_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/classes/$CLASS_ID/students/$STUDENT2_ID" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          [ "$ALLOC2_RES" = "409" ] || (echo "esperado 409, veio $ALLOC2_RES" && exit 1)

          echo "--- remover aluno da turma libera vaga (REQ-005) ---"
          REMOVE_RES=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "http://localhost:3000/api/v1/classes/$CLASS_ID/students/$STUDENT_ID" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          [ "$REMOVE_RES" = "204" ] || (echo "esperado 204, veio $REMOVE_RES" && exit 1)
          REALLOC_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/classes/$CLASS_ID/students/$STUDENT2_ID" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          [ "$REALLOC_RES" = "201" ] || (echo "esperado 201 após liberar vaga, veio $REALLOC_RES" && exit 1)

          echo "MOD-004 OK — criação de turma com geração de ocupações (AC-001), alocação com limite de capacidade (AC-002) e remoção (REQ-005) funcionam de ponta a ponta contra o Neon."

          echo "--- MOD-007: GET /dashboard/summary (REQ-006) ---"
          DASHBOARD_RES=$(curl -s http://localhost:3000/api/v1/dashboard/summary -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$DASHBOARD_RES"
          echo "$DASHBOARD_RES" | jq -e '
            (.alunosAtivos >= 3) and
            (.ocupacaoTurmasPct >= 0 and .ocupacaoTurmasPct <= 100) and
            (.ocupacaoQuadrasPct >= 0 and .ocupacaoQuadrasPct <= 100)
          '
          echo "--- GET /dashboard/summary?periodo=2026-09 (formato AAAA-MM aceito) ---"
          curl -s "http://localhost:3000/api/v1/dashboard/summary?periodo=2026-09" -H "Authorization: Bearer $ACCESS_TOKEN" \
            | jq -e '.ocupacaoQuadrasPct >= 0'
          echo "MOD-007 OK — dashboard agrega alunos ativos + ocupação de turma + ocupação de quadra contra o Neon."

          echo "--- SPEC-009: admin liga o auto-cadastro da empresa demo (o seed cria com permiteAutoCadastro=false) ---"
          # Sem isto o register-aluno abaixo responde a MESMA recusa de slug
          # inexistente (desenho da SPEC-009: nao vazar se a empresa existe).
          curl -s -X PATCH http://localhost:3000/api/v1/me/company \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"permiteAutoCadastro":true}' | jq -e '.permiteAutoCadastro == true'

          echo "--- SPEC-005: registra e loga como aluno via self-service (register-aluno) ---"
          # SPEC-009/REQ-001: a empresa e identificada pelo SLUG do link publico,
          # nao pelo companyId. O slug do seed e fixo (prisma/seed.ts).
          ALUNO_EMAIL="aluno-app-ci-$RUN_ID@playck-tests.demo"
          REG_CODE=$(curl -s -o /tmp/register-aluno.json -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/register-aluno \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$ALUNO_EMAIL\",\"senha\":\"senha-forte-123\",\"nome\":\"Aluno App CI\",\"empresaSlug\":\"playck-qa-demo\"}")
          cat /tmp/register-aluno.json; echo
          [ "$REG_CODE" = "201" ] || (echo "register-aluno: esperado 201, veio $REG_CODE" && exit 1)

          ALUNO_LOGIN_RES=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$ALUNO_EMAIL\",\"senha\":\"senha-forte-123\"}")
          echo "$ALUNO_LOGIN_RES" | jq -e '.usuario.role == "aluno"'
          ALUNO_TOKEN=$(echo "$ALUNO_LOGIN_RES" | jq -r '.accessToken')

          echo "--- aluno lê quadras (CON-005.1, leitura aberta a aluno) ---"
          curl -s http://localhost:3000/api/v1/courts -H "Authorization: Bearer $ALUNO_TOKEN" | jq -e '.total >= 1'

          echo "--- aluno NÃO consegue criar quadra (403, escrita continua company_admin-only) ---"
          ALUNO_CREATE_COURT_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/courts \
            -H "Authorization: Bearer $ALUNO_TOKEN" -H "Content-Type: application/json" \
            -d '{"nome":"Quadra Indevida","esporte":"tenis","precoHora":1}')
          [ "$ALUNO_CREATE_COURT_RES" = "403" ] || (echo "esperado 403, veio $ALUNO_CREATE_COURT_RES" && exit 1)

          echo "--- aluno reserva quadra para si mesmo, sem informar alunoId (REQ-005) ---"
          ALUNO_BOOKING_RES=$(curl -s -X POST http://localhost:3000/api/v1/bookings \
            -H "Authorization: Bearer $ALUNO_TOKEN" -H "Content-Type: application/json" \
            -d "{\"quadraId\":\"$QUADRA_ID\",\"data\":\"2026-08-26\",\"horaInicio\":\"09:00\",\"horaFim\":\"10:00\"}")
          echo "$ALUNO_BOOKING_RES"
          echo "$ALUNO_BOOKING_RES" | jq -e '.alunoId and .origemTipo == "AVULSO"'
          ALUNO_BOOKING_ID=$(echo "$ALUNO_BOOKING_RES" | jq -r '.id')
          ALUNO_PROPRIO_ID=$(echo "$ALUNO_BOOKING_RES" | jq -r '.alunoId')

          echo "--- aluno tentando informar alunoId de outro aluno é ignorado, servidor força o próprio id do token (REQ-005) ---"
          OUTRO_BOOKING_RES=$(curl -s -X POST http://localhost:3000/api/v1/bookings \
            -H "Authorization: Bearer $ALUNO_TOKEN" -H "Content-Type: application/json" \
            -d "{\"quadraId\":\"$QUADRA_ID\",\"data\":\"2026-08-26\",\"horaInicio\":\"10:00\",\"horaFim\":\"11:00\",\"alunoId\":\"$STUDENT_ID\"}")
          echo "$OUTRO_BOOKING_RES" | jq -e ".alunoId == \"$ALUNO_PROPRIO_ID\""
          OUTRO_BOOKING_ID=$(echo "$OUTRO_BOOKING_RES" | jq -r '.id')

          echo "--- GET /bookings do aluno só mostra as próprias reservas ---"
          curl -s http://localhost:3000/api/v1/bookings -H "Authorization: Bearer $ALUNO_TOKEN" \
            | jq -e --arg id "$ALUNO_PROPRIO_ID" '[.data[] | select(.alunoId != $id)] | length == 0'

          echo "--- GET /me/classes do aluno (CON-004.5) — sem turma alocada, lista vazia ---"
          curl -s http://localhost:3000/api/v1/me/classes -H "Authorization: Bearer $ALUNO_TOKEN" | jq -e '. == []'

          echo "--- aluno cancela a própria reserva (204) ---"
          CANCEL_ALUNO_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/bookings/$ALUNO_BOOKING_ID/cancel" \
            -H "Authorization: Bearer $ALUNO_TOKEN")
          [ "$CANCEL_ALUNO_RES" = "204" ] || (echo "esperado 204, veio $CANCEL_ALUNO_RES" && exit 1)

          echo "--- aluno NÃO consegue cancelar reserva de outro aluno (403) ---"
          CANCEL_OUTRO_RES=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/v1/bookings/$BOOKING_ID/cancel" \
            -H "Authorization: Bearer $ALUNO_TOKEN")
          [ "$CANCEL_OUTRO_RES" = "403" ] || (echo "esperado 403, veio $CANCEL_OUTRO_RES" && exit 1)

          echo "SPEC-005 OK — leitura de quadras, reserva/cancelamento escopados ao próprio aluno (REQ-005) e /me/classes funcionam de ponta a ponta contra o Neon."

          echo "--- SPEC-006: GET /payment-config (company_admin, dado semeado pela etapa 4) ---"
          CONFIG_RES=$(curl -s http://localhost:3000/api/v1/payment-config -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "$CONFIG_RES"
          echo "$CONFIG_RES" | jq -e '.linkPagamentoUrl and .whatsappNumero'
          CONFIG_LINK_ORIGINAL=$(echo "$CONFIG_RES" | jq -r '.linkPagamentoUrl')
          CONFIG_WHATSAPP_ORIGINAL=$(echo "$CONFIG_RES" | jq -r '.whatsappNumero')

          echo "--- aluno NÃO consegue ler /payment-config (403, rota exclusiva company_admin) ---"
          ALUNO_CONFIG_RES=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/payment-config \
            -H "Authorization: Bearer $ALUNO_TOKEN")
          [ "$ALUNO_CONFIG_RES" = "403" ] || (echo "esperado 403, veio $ALUNO_CONFIG_RES" && exit 1)

          echo "--- PUT /payment-config (REQ-001) — round trip com um valor novo ---"
          PUT_RES=$(curl -s -X PUT http://localhost:3000/api/v1/payment-config \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"linkPagamentoUrl\":\"https://pay.example.com/ci-$RUN_ID\",\"whatsappNumero\":\"+5511988887777\"}")
          echo "$PUT_RES" | jq -e ".linkPagamentoUrl == \"https://pay.example.com/ci-$RUN_ID\" and .whatsappNumero == \"+5511988887777\""

          echo "--- GET /payment-config/public (aluno, REQ-002/AC-003) — vê o link/whatsapp, sem companyId ---"
          PUBLIC_RES=$(curl -s http://localhost:3000/api/v1/payment-config/public -H "Authorization: Bearer $ALUNO_TOKEN")
          echo "$PUBLIC_RES"
          echo "$PUBLIC_RES" | jq -e ".linkPagamentoUrl == \"https://pay.example.com/ci-$RUN_ID\" and (has(\"companyId\") | not)"

          echo "--- company_admin NÃO consegue ler /payment-config/public (403, rota exclusiva aluno) ---"
          ADMIN_PUBLIC_RES=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/payment-config/public \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          [ "$ADMIN_PUBLIC_RES" = "403" ] || (echo "esperado 403, veio $ADMIN_PUBLIC_RES" && exit 1)

          echo "--- restaura o payment-config semeado (não deixar a empresa demo com dado de teste) ---"
          curl -s -X PUT http://localhost:3000/api/v1/payment-config \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"linkPagamentoUrl\":\"$CONFIG_LINK_ORIGINAL\",\"whatsappNumero\":\"$CONFIG_WHATSAPP_ORIGINAL\"}" > /dev/null

          echo "--- aluno NÃO consegue marcar pagamento (403, AC-001/INV-007) ---"
          ALUNO_PAY_RES=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH "http://localhost:3000/api/v1/bookings/$OUTRO_BOOKING_ID/payment-status" \
            -H "Authorization: Bearer $ALUNO_TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"pago"}')
          [ "$ALUNO_PAY_RES" = "403" ] || (echo "esperado 403, veio $ALUNO_PAY_RES" && exit 1)

          echo "--- company_admin marca reserva como paga (REQ-003) ---"
          PAY_RES=$(curl -s -X PATCH "http://localhost:3000/api/v1/bookings/$OUTRO_BOOKING_ID/payment-status" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"pago"}')
          echo "$PAY_RES" | jq -e '.statusPagamento == "pago"'

          echo "--- marcar como pago de novo é idempotente, sem erro (AC-002) ---"
          PAY_AGAIN_RES=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH "http://localhost:3000/api/v1/bookings/$OUTRO_BOOKING_ID/payment-status" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"pago"}')
          [ "$PAY_AGAIN_RES" = "200" ] || (echo "esperado 200, veio $PAY_AGAIN_RES" && exit 1)

          echo "SPEC-006 OK — configuração de pagamento (escopada a company_admin/aluno) e confirmação manual de status funcionam de ponta a ponta contra o Neon."

          echo "--- FIT-002: rotação atômica de refresh token — 2 POST /auth/refresh simultâneos com o mesmo token, 3 execuções independentes ---"
          # Achado ao rodar a 1ª versão deste teste (encadeada): perder a
          # corrida revoga TODA a sessão do usuário (REQ-003, "reuso é
          # sinal de comprometimento") — inclusive o token novo do
          # vencedor da mesma iteração, se a revogação em massa do
          # perdedor correr depois do issueTokens do vencedor. Por
          # desenho (não é bug: proteção contra replay não distingue
          # corrida legítima de reuso malicioso), encadear o token do
          # vencedor pra próxima iteração não funciona — cada execução
          # precisa do próprio login. POST /auth/login tem throttle de
          # 10/15min por IP (NFR-002); este smoke test já usa 6 antes
          # daqui, então 3 execuções independentes (9 no total) cabem
          # com folga — número menor que FIT-001 de propósito: a garantia
          # aqui é um UPDATE atômico de banco (lock de linha do Postgres,
          # não um catch de tipo de erro específico como em INV-001), não
          # precisa de dezenas de execuções pra ganhar confiança.
          FALHAS_FIT2=0
          for i in $(seq 1 3); do
            LOGIN_ITER_RES=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"admin@playck-qa.demo\",\"senha\":\"$SEED_ADMIN_SENHA\"}")
            REFRESH_TOKEN_ITER=$(echo "$LOGIN_ITER_RES" | jq -r '.refreshToken')

            curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/refresh \
              -H "Cookie: refresh_token=$REFRESH_TOKEN_ITER" > "/tmp/fit2_a_${i}.code" &
            PID1=$!
            curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/refresh \
              -H "Cookie: refresh_token=$REFRESH_TOKEN_ITER" > "/tmp/fit2_b_${i}.code" &
            PID2=$!
            wait "$PID1" "$PID2"
            C1=$(cat "/tmp/fit2_a_${i}.code")
            C2=$(cat "/tmp/fit2_b_${i}.code")
            if { [ "$C1" = "200" ] && [ "$C2" = "401" ]; } || { [ "$C1" = "401" ] && [ "$C2" = "200" ]; }; then
              echo "  iteração $i OK ($C1/$C2)"
            else
              echo "  iteração $i FALHOU ($C1/$C2) — rotação concorrente pode ter emitido 2 pares de token ou erro inesperado"
              FALHAS_FIT2=$((FALHAS_FIT2 + 1))
            fi
          done
          if [ "$FALHAS_FIT2" -gt 0 ]; then
            echo "FIT-002 falhou em $FALHAS_FIT2 de 3 execuções"
            exit 1
          fi
          echo "FIT-002 OK — 3/3 execuções independentes, rotação atômica de refresh token sem duplo par emitido sob concorrência real (updateMany WHERE revokedAt: null comprovado no banco real)."

          echo "--- FIT-003 (SPEC-009/INV-009): 2 aceites simultâneos do MESMO convite, 5 execuções ---"
          # A garantia é a claim atômica do aceite: um UPDATE só, com
          # `usado_em IS NULL` no WHERE. Ler-e-depois-escrever sob READ
          # COMMITTED deixaria as duas requisições concorrentes lerem "não
          # usado" e criarem duas contas com o mesmo convite.
          #
          # 5 execuções, não 20 como FIT-001: aqui a garantia é lock de
          # linha do Postgres (mesma natureza de FIT-002), não um catch de
          # tipo de erro. Cada execução consome 1 e-mail novo, e o e-mail é
          # único global (INV-004) — por isso o RUN_ID no endereço.
          FALHAS_FIT3=0
          for i in $(seq 1 5); do
            CONVITE_RES=$(curl -s -X POST http://localhost:3000/api/v1/invites \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"nome\":\"Convidado CI\",\"email\":\"convite-ci-$i-$RUN_ID@playck-tests.demo\"}")
            CONVITE_TOKEN=$(echo "$CONVITE_RES" | jq -r '.token')

            curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/aceitar-convite \
              -H "Content-Type: application/json" \
              -d "{\"token\":\"$CONVITE_TOKEN\",\"senha\":\"senha-forte-123\"}" > "/tmp/fit3_a_${i}.code" &
            PID_A=$!
            curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/v1/auth/aceitar-convite \
              -H "Content-Type: application/json" \
              -d "{\"token\":\"$CONVITE_TOKEN\",\"senha\":\"senha-forte-123\"}" > "/tmp/fit3_b_${i}.code" &
            PID_B=$!
            wait "$PID_A" "$PID_B"
            F1=$(cat "/tmp/fit3_a_${i}.code")
            F2=$(cat "/tmp/fit3_b_${i}.code")
            if { [ "$F1" = "201" ] && [ "$F2" = "410" ]; } || { [ "$F1" = "410" ] && [ "$F2" = "201" ]; }; then
              echo "  iteração $i OK ($F1/$F2)"
            else
              echo "  iteração $i FALHOU ($F1/$F2) — o mesmo convite pode ter criado 2 contas"
              FALHAS_FIT3=$((FALHAS_FIT3 + 1))
            fi
          done
          if [ "$FALHAS_FIT3" -gt 0 ]; then
            echo "FIT-003 falhou em $FALHAS_FIT3 de 5 execuções"
            exit 1
          fi
          echo "FIT-003 OK — 5/5 execuções com exatamente um aceite vencedor (INV-009 comprovado no banco real)."

          kill $APP_PID

          echo "--- limpando dado de teste criado pelo smoke test ---"
          # Mesmo desenho do cleanup inicial (SPEC-032): eventos -> acoes antes
          # de ocupacoes, usuarios e empresa, que eles referenciam com RESTRICT.
          # Triggers append-only desligadas pelo dono, dentro da transacao.
          cat <<SQL | pnpm exec prisma db execute --stdin --schema prisma/schema.prisma
          BEGIN;
          ALTER TABLE eventos_de_ocupacao DISABLE TRIGGER eventos_append_only;
          ALTER TABLE acoes_administrativas DISABLE TRIGGER acoes_append_only;
          DELETE FROM eventos_de_ocupacao WHERE ocupacao_id IN (
            SELECT id FROM ocupacoes_quadra
             WHERE (quadra_id = '$QUADRA_ID' AND data >= '2026-08-25' AND data <= '2026-09-30')
                OR origem_turma_id = '$CLASS_ID');
          DELETE FROM eventos_de_ocupacao WHERE company_id = '$COMPANY_ID';
          DELETE FROM acoes_administrativas a
           WHERE a.company_id = '$COMPANY_ID'
              OR a.autor_id IN (SELECT id FROM usuarios WHERE email LIKE '%-$RUN_ID@playck-tests.demo' OR email = 'ci-$RUN_ID@playck-tests.demo')
              OR NOT EXISTS (SELECT 1 FROM eventos_de_ocupacao e WHERE e.acao_id = a.id);
          DELETE FROM alunos WHERE usuario_id IN (SELECT id FROM usuarios WHERE email LIKE 'convite-ci-%-$RUN_ID@playck-tests.demo');
          DELETE FROM usuarios WHERE email LIKE 'convite-ci-%-$RUN_ID@playck-tests.demo';
          DELETE FROM convites_aluno WHERE email LIKE 'convite-ci-%-$RUN_ID@playck-tests.demo';
          DELETE FROM usuarios WHERE email = 'ci-$RUN_ID@playck-tests.demo';
          DELETE FROM empresas WHERE id = '$COMPANY_ID';
          DELETE FROM turma_alunos WHERE turma_id = '$CLASS_ID';
          DELETE FROM ocupacoes_quadra WHERE origem_turma_id = '$CLASS_ID';
          DELETE FROM turmas WHERE id = '$CLASS_ID';
          DELETE FROM ocupacoes_quadra WHERE quadra_id = '$QUADRA_ID' AND data >= '2026-08-25' AND data <= '2026-09-30';
          DELETE FROM alunos WHERE usuario_id = (SELECT id FROM usuarios WHERE email = 'aluno-ci-$RUN_ID@playck-tests.demo');
          DELETE FROM usuarios WHERE email = 'aluno-ci-$RUN_ID@playck-tests.demo';
          DELETE FROM alunos WHERE usuario_id = (SELECT id FROM usuarios WHERE email = 'aluno-ci-2-$RUN_ID@playck-tests.demo');
          DELETE FROM usuarios WHERE email = 'aluno-ci-2-$RUN_ID@playck-tests.demo';
          DELETE FROM alunos WHERE usuario_id = (SELECT id FROM usuarios WHERE email = 'aluno-app-ci-$RUN_ID@playck-tests.demo');
          DELETE FROM usuarios WHERE email = 'aluno-app-ci-$RUN_ID@playck-tests.demo';
          ALTER TABLE eventos_de_ocupacao ENABLE TRIGGER eventos_append_only;
          ALTER TABLE acoes_administrativas ENABLE TRIGGER acoes_append_only;
          COMMIT;
          SQL

          echo "Smoke test OK — auth (com FIT-002) + MOD-002 + MOD-003 + MOD-004 (turmas) + MOD-005 (com FIT-001, aberto a aluno) + MOD-006 (pagamento manual) + MOD-007 (dashboard) funcionam de ponta a ponta contra o Neon."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_ADMIN_SENHA: ${{ secrets.SEED_ADMIN_SENHA }}
          SEED_SUPER_ADMIN_SENHA: ${{ secrets.SEED_SUPER_ADMIN_SENHA }}
          # SPEC-017/ADR-015: o StorageModule valida as seis variaveis do
          # Spaces no BOOT, e sem elas `node dist/main.js` morre antes de
          # abrir a porta — o smoke inteiro (e o FIT-001 dentro dele) vira
          # `curl: exit 7`. Mesmos valores-placebo do ci.yml, pela mesma
          # razao: aqui elas so precisam EXISTIR, nada neste passo fala com
          # o bucket.
          #
          # Achado em 2026-09-03: este passo NAO rodava desde 2026-08-23.
          # Os runs verdes de 29 e 30/08 foram disparados sem seed, com o
          # smoke SKIPPED — o workflow ficava verde sem executar o gate.
          SPACES_REGION: nyc3
          SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com
          SPACES_BUCKET: playck-ci
          SPACES_CDN_URL: https://playck-ci.nyc3.cdn.digitaloceanspaces.com
          SPACES_KEY: ci-spaces-key
          SPACES_SECRET: ci-spaces-secret
